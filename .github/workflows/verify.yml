#
# Runs the repository's one-command verification (./verify.sh) on push,
# pull_request, and workflow_dispatch. verify.sh fetches the Mathlib cache,
# builds the Lean modules, prints axioms, installs the pinned Python
# dependencies, and runs the exact symbolic checks and the Arb interval
# certificate. It fails the job if the build reports sorry or an error, or
# if any of the 50 audited declarations uses an axiom other than propext,
# Classical.choice, and Quot.sound. This workflow does not change the
# mathematics and is not a Clay solution.
name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: ./verify.sh
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install elan with the repository toolchain
        run: |
          set -euo pipefail
          TOOLCHAIN="$(cat lean/lean-toolchain)"
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain "$TOOLCHAIN"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          echo "Installed elan with default toolchain: $TOOLCHAIN"

      - name: Report Lean toolchain
        run: |
          cat lean/lean-toolchain
          elan show
          lake --version
          lean --version

      - name: Set up Python 3.13 (pinned in scripts/requirements.txt)
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run one-command verification
        run: ./verify.sh

      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-logs
          path: out/
          if-no-files-found: error
